<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="20%" stop-color="#DFBA51" />
      <stop offset="45%" stop-color="#C59B27" />
      <stop offset="70%" stop-color="#F5DF88" />
      <stop offset="90%" stop-color="#9E721D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="goldRimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="30%" stop-color="#C89D2B" />
      <stop offset="70%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8F6312" />
    </linearGradient>

    <radialGradient id="badgeFace" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#FBFBFC" />
      <stop offset="100%" stop-color="#F0F1F4" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B6914" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Disc -->
  <circle cx="250" cy="250" r="240" fill="url(#badgeFace)" stroke="url(#goldRimGradient)" stroke-width="7" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldRimGradient)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Gold Monogram N Emblem with Upward Arrow and Circuit Node -->
  <g transform="translate(0, -18)" stroke="url(#goldGradient)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Main Loop Contour -->
    <path 
      d="M 175 272 
         L 175 160 
         C 175 135, 212 135, 230 162 
         L 282 238 
         L 320 180" 
      stroke-width="18" 
    />

    <!-- Arrow Head at top right -->
    <path 
      d="M 288 152 L 332 165 L 319 209 Z" 
      fill="url(#goldGradient)" 
      stroke-width="2" 
    />

    <!-- Inner Bottom Loop and Connection Terminal -->
    <path 
      d="M 175 270 
         C 175 235, 235 180, 260 215 
         L 300 270 
         C 316 292, 338 285, 342 260 
         L 342 215" 
      stroke-width="18" 
    />

    <!-- Circuit Connection Terminal Node Circle -->
    <circle cx="342" cy="205" r="14" fill="url(#badgeFace)" stroke="url(#goldGradient)" stroke-width="12" />
  </g>

  <!-- NEXORA Typography -->
  <text 
    x="250" 
    y="345" 
    text-anchor="middle" 
    font-family="'Plus Jakarta Sans', 'Cinzel', 'Cinzel Decorative', sans-serif" 
    font-size="52" 
    font-weight="900" 
    letter-spacing="9" 
    fill="url(#goldGradient)"
  >
    NEXORA
  </text>

  <!-- LIMITED Typography -->
  <text 
    x="250" 
    y="385" 
    text-anchor="middle" 
    font-family="'Plus Jakarta Sans', sans-serif" 
    font-size="20" 
    font-weight="700" 
    letter-spacing="14" 
    fill="url(#goldGradient)" 
    opacity="0.95"
  >
    LIMITED
  </text>
</svg>
